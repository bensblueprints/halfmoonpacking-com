name: Deploy to Coolify

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            echo "=== Starting Halfmoon Packing deployment ==="
            
            if [ -d "/tmp/halfmoonpacking-com/.git" ]; then
              cd /tmp/halfmoonpacking-com
              git reset --hard HEAD
              git pull origin master
            else
              rm -rf /tmp/halfmoonpacking-com
              git clone https://github.com/bensblueprints/halfmoonpacking-com.git /tmp/halfmoonpacking-com
              cd /tmp/halfmoonpacking-com
            fi
            
            cat > /tmp/halfmoonpacking-com/nginx.conf << 'NGINXEOF'
            server {
                listen 80;
                server_name localhost;
                location / {
                    root /usr/share/nginx/html;
                    index index.html index.htm;
                    try_files $uri $uri.html $uri/index.html $uri/index.htm $uri/ =404;
                }
                error_page 404 /404.html;
                location = /404.html {
                    root /usr/share/nginx/html;
                    internal;
                }
                error_page 500 502 503 504 /50x.html;
                location = /50x.html {
                    root /usr/share/nginx/html;
                    internal;
                }
            }
            NGINXEOF
            
            cat > /tmp/halfmoonpacking-com/Dockerfile << 'DOCKEREOF'
            FROM nginx:alpine
            WORKDIR /usr/share/nginx/html/
            COPY . .
            RUN rm -rf Dockerfile .git .gitignore .deploy-trigger
            COPY ./nginx.conf /etc/nginx/conf.d/default.conf
            EXPOSE 80
            DOCKEREOF
            
            cd /tmp/halfmoonpacking-com
            docker build -t pqr68ea6p7ddegd4gyln4egy:latest .
            
            cd /data/coolify/applications/pqr68ea6p7ddegd4gyln4egy
            sed -i "s|image: .*|image: 'pqr68ea6p7ddegd4gyln4egy:latest'|" docker-compose.yaml
            docker compose up -d
            
            docker images 'pqr68ea6p7ddegd4gyln4egy*' --format '{{.Repository}}:{{.Tag}}' | grep -v 'latest' | tail -n +3 | xargs -r docker rmi || true
            
            echo "=== Deployment complete ==="